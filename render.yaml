services:
  - type: web
    name: chilli-plant-api
    runtime: docker
    plan: 1c-2g
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: "10000"
      - key: FIREBASE_PROJECT_ID
        value: flutterchilli
      - key: FIREBASE_STORAGE_BUCKET
        value: flutterchilli.firebasestorage.app
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: MODEL_PATH
        value: /app/models/chilli_leaf_disease_final.tflite
      - key: LABELS_PATH
        value: /app/models/class_names.json
      - key: IMAGE_VALIDATION_MODEL_PATH
        value: /app/models/leaf_detection.tflite
      - key: IMAGE_VALIDATION_REQUIRED
        value: "false"
      - key: IMAGE_VALIDATION_POSITIVE_CLASS_INDEX
        value: "1"
      - key: IMAGE_VALIDATION_THRESHOLD
        value: "0.55"
      - key: IMAGE_VALIDATION_INVERT_SCORE
        value: "false"
      - key: IMAGE_VALIDATION_INPUT_SCALE
        value: 0_1
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: ALLOWED_ORIGINS
        value: ""
